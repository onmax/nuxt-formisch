minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - vite-doctor@0.1.1

trustPolicy: no-downgrade
trustPolicyExclude:
  # newer semver majors carry provenance, 6.x never did; @babel/core (via nuxt) depends on it
  - semver@6.3.1
  # same GitHub OIDC trusted publisher and provenance as 0.1.0, published without staged approval
  - vite-doctor@0.1.1

packages:
  - playground

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: false
  vue-demi: false

catalogs:
  build:
    '@nuxt/module-builder': ^1.0.3
    '@types/node': ^24.19.2
    publint: ^0.3.25
    typescript: ^6.0.3
    vue-tsc: ^3.3.13
  lint:
    '@nuxt/eslint-config': ^1.17.0
    eslint: ^10.13.0
    vite-doctor: ^0.1.1
  nuxt:
    '@nuxt/ui': ^4.12.0
    # Nuxt 4 runs on h3 v1; keep this on the major Nuxt ships
    h3: ^1.15.11
    nuxt: ^4.6.2
    tailwindcss: ^4.3.3
    valibot: ^1.5.0
    vue: ^3.5.44
  prod:
    '@formisch/vue': ^1.1.0
    '@nuxt/kit': ^4.6.2
    '@standard-schema/spec': ^1.1.0
    scule: ^1.3.0
  test:
    '@nuxt/test-utils': ^4.3.4
    playwright-core: ^1.64.1
    vitest: ^5.0.5
